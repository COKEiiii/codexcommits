[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codexcommits"
version = "0.1.0"
description = "Safe, reviewed Conventional Commits powered by your Codex subscription"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "COKEiiii"}]
keywords = ["codex", "git", "commit", "conventional-commits", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
codexcommits = "codexcommits.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/COKEiiii/codexcommits"
Issues = "https://github.com/COKEiiii/codexcommits/issues"

[tool.setuptools.packages.find]
where = ["src"]
