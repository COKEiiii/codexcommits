name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist stage
          build() {
            os="$1" arch="$2" label="$3" binary="codexcommits"
            [ "$os" = windows ] && binary="codexcommits.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${VERSION#v}" -o "stage/$binary" .
            if [ "$os" = windows ]; then
              (cd stage && zip -q "../dist/codexcommits_${label}.zip" "$binary")
            else
              tar -C stage -czf "dist/codexcommits_${label}.tar.gz" "$binary"
            fi
            rm "stage/$binary"
          }
          build darwin amd64 macOS_x86_64
          build darwin arm64 macOS_arm64
          build linux amd64 Linux_x86_64
          build linux arm64 Linux_arm64
          build windows amd64 Windows_x86_64
          build windows arm64 Windows_arm64
          (cd dist && sha256sum * > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
